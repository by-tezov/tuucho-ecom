# Local Postgres for tuucho-ecom. Isolated from any other shop on this
# machine: different volume name and host port (5434).
services:
  postgres:
    image: postgres:10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in config.private.<env>.json}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in config.private.<env>.json}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in config.private.<env>.json}
    ports:
      - '5434:5432'
    volumes:
      - tuucho-ecom-postgres-10-data:/var/lib/postgresql/data

volumes:
  tuucho-ecom-postgres-10-data:
